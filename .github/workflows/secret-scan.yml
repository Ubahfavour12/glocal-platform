# Catch a secret before it reaches the remote — and keep catching, because a
# key committed once is in the history forever and the only real fix is
# rotating it at the provider.
#
# Runs on every push and pull request. The local hook in `npm run hooks:install`
# is the faster feedback loop; this is the one that cannot be skipped with
# `--no-verify`, which is exactly why both exist.

name: Secret scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret added in an earlier commit and removed in a
          # later one is still in the clone, and still needs rotating. Scanning
          # only the tip would report clean on exactly that case.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
